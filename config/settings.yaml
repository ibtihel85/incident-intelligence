# ============================================================
# Autonomous Incident Intelligence System — Configuration
# ============================================================

system:
  name: "Autonomous Incident Intelligence System"
  version: "1.0.0"
  log_level: "INFO"

# ── Anomaly Detection ────────────────────────────────────────
anomaly_detection:
  cpu:
    warning_threshold: 80.0      # %
    critical_threshold: 95.0     # %
    spike_window: 5              # consecutive samples
  memory:
    warning_threshold: 75.0      # %
    critical_threshold: 90.0     # %
    leak_slope_threshold: 0.5    # % per minute — monotonic growth
  error_rate:
    warning_threshold: 5.0       # errors per minute
    critical_threshold: 20.0
  latency:
    warning_threshold_ms: 500
    critical_threshold_ms: 2000
  statistical:
    zscore_threshold: 3.0        # standard deviations
    iqr_multiplier: 1.5

# ── Root Cause Analysis ──────────────────────────────────────
root_cause:
  min_confidence: 0.4
  causal_chain_depth: 5

# ── Knowledge Base ───────────────────────────────────────────
knowledge_base:
  path: "data/knowledge_base.json"
  similarity_threshold: 0.6
  max_results: 5

# ── Reporting ────────────────────────────────────────────────
reporting:
  output_dir: "reports/"
  include_raw_metrics: true
  include_timeline: true

# ── MCP Tools ────────────────────────────────────────────────
mcp_tools:
  log_query:
    max_lines: 10000
    default_window_minutes: 60
  metrics:
    default_resolution: "1m"
  knowledge_search:
    embedding_model: "tfidf"   # tfidf | bm25
